<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="t">
  <title id="t">Atardecer patagónico: volcán Lanín nevado, lago, araucarias, cóndores andinos y un caminante con mochila</title>
  <defs>
    <!-- Cielo de atardecer (misma paleta que el logo) -->
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2a55"/>
      <stop offset="0.35" stop-color="#8a4a6b"/>
      <stop offset="0.62" stop-color="#e0704a"/>
      <stop offset="0.8" stop-color="#f6c36b"/>
    </linearGradient>
    <radialGradient id="brillo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe3a3" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffe3a3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lago" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0a865"/>
      <stop offset="0.5" stop-color="#9a5c6e"/>
      <stop offset="1" stop-color="#3b3a5a"/>
    </linearGradient>
    <linearGradient id="volcan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a5868"/>
      <stop offset="1" stop-color="#6b3f55"/>
    </linearGradient>

    <!-- Cóndor andino visto desde abajo, planeando -->
    <g id="condor">
      <path d="M-6,-2 C-30,-22 -58,-22 -86,-11 L-80,-5 L-88,-2 L-80,1 L-86,5 L-76,5 C-52,11 -26,11 -6,8 Z"/>
      <path d="M6,-2 C30,-22 58,-22 86,-11 L80,-5 L88,-2 L80,1 L86,5 L76,5 C52,11 26,11 6,8 Z"/>
      <ellipse cx="0" cy="3" rx="9" ry="7"/>
      <path d="M-7,8 L0,20 L7,8 Z"/>
      <circle cx="0" cy="-8" r="4"/>
      <!-- collar blanco característico -->
      <ellipse cx="0" cy="-3" rx="6" ry="2.6" fill="#f4efe6"/>
      <!-- franja blanca en las alas -->
      <path d="M-20,2 C-38,3 -56,2 -70,0" fill="none" stroke="#f4efe6" stroke-width="2.4" stroke-linecap="round" opacity="0.85"/>
      <path d="M20,2 C38,3 56,2 70,0" fill="none" stroke="#f4efe6" stroke-width="2.4" stroke-linecap="round" opacity="0.85"/>
    </g>

    <!-- Araucaria (pehuén): tronco recto y copa en forma de paraguas -->
    <g id="araucaria">
      <rect x="-3" y="-150" width="6" height="150"/>
      <path d="M-55,-118 Q-30,-134 0,-136 Q30,-134 55,-118 Q30,-124 0,-124 Q-30,-124 -55,-118 Z"/>
      <path d="M-48,-134 Q-24,-150 0,-152 Q24,-150 48,-134 Q24,-140 0,-140 Q-24,-140 -48,-134 Z"/>
      <path d="M-36,-150 Q-18,-164 0,-166 Q18,-164 36,-150 Q18,-156 0,-156 Q-18,-156 -36,-150 Z"/>
      <path d="M-20,-164 Q0,-178 20,-164 Q0,-170 -20,-164 Z"/>
      <path d="M-55,-118 l-6,6 M55,-118 l6,6 M-48,-134 l-6,5 M48,-134 l6,5" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Guanaco de perfil -->
    <g id="guanaco">
      <ellipse cx="0" cy="-30" rx="24" ry="11"/>
      <path d="M-24,-34 q-7,4 -5,12 q3,-6 7,-6 z"/>
      <polygon points="14,-37 23,-40 32,-72 24,-74"/>
      <ellipse cx="33" cy="-74" rx="9" ry="5"/>
      <polygon points="25,-78 27,-87 30,-78"/>
      <polygon points="29,-78 32,-86 34,-77"/>
      <rect x="-19" y="-24" width="4" height="24" rx="1.5"/>
      <rect x="-12" y="-24" width="4" height="24" rx="1.5"/>
      <rect x="11" y="-24" width="4" height="24" rx="1.5"/>
      <rect x="17" y="-24" width="4" height="24" rx="1.5"/>
    </g>
  </defs>

  <!-- Cielo -->
  <rect width="1600" height="900" fill="url(#cielo)"/>

  <!-- Estrellas tempranas -->
  <g fill="#fff4ea" opacity="0.7">
    <circle cx="210" cy="70" r="1.6"/><circle cx="340" cy="130" r="1.2"/>
    <circle cx="1260" cy="80" r="1.8"/><circle cx="1420" cy="150" r="1.2"/>
    <circle cx="1110" cy="40" r="1.3"/><circle cx="470" cy="45" r="1.1"/>
  </g>

  <!-- Sol poniéndose -->
  <circle cx="1080" cy="520" r="210" fill="url(#brillo)"/>
  <circle cx="1080" cy="520" r="78" fill="#ffe3a3"/>

  <!-- Cordillera lejana -->
  <polygon points="0,560 120,470 230,520 360,430 470,510 560,470 640,560 980,560 1060,480 1170,520 1290,440 1400,500 1500,450 1600,500 1600,620 0,620" fill="#a35f6c"/>

  <!-- Volcán Lanín con nieve -->
  <polygon points="470,600 800,150 1130,600" fill="url(#volcan)"/>
  <path d="M800,150 L733,241 L752,236 L770,262 L790,240 L810,268 L828,238 L848,250 L867,241 Z" fill="#fff4ea"/>
  <path d="M800,150 L867,241 L848,250 L828,238 L810,268 L800,250 Z" fill="#e7d6dc" opacity="0.7"/>

  <!-- Lago con reflejos -->
  <rect x="0" y="600" width="1600" height="300" fill="url(#lago)"/>
  <polygon points="560,600 800,840 1040,600" fill="#6b3f55" opacity="0.35"/>
  <g stroke="#ffe3a3" stroke-linecap="round" opacity="0.75">
    <line x1="1010" y1="625" x2="1150" y2="625" stroke-width="4"/>
    <line x1="1030" y1="648" x2="1130" y2="648" stroke-width="3"/>
    <line x1="1050" y1="672" x2="1110" y2="672" stroke-width="2.5"/>
    <line x1="1065" y1="696" x2="1095" y2="696" stroke-width="2"/>
  </g>

  <!-- Orillas y cerros del frente -->
  <path d="M0,640 L140,585 L260,615 L380,580 L470,630 L590,720 L590,900 L0,900 Z" fill="#2f5d50"/>
  <path d="M1010,720 L1110,650 L1200,590 L1330,620 L1460,570 L1600,600 L1600,900 L1010,900 Z" fill="#2f5d50"/>
  <path d="M0,760 C200,700 380,720 560,780 C760,840 900,800 1060,760 C1240,715 1420,730 1600,700 L1600,900 L0,900 Z" fill="#1f3f36"/>

  <!-- Araucarias -->
  <g fill="#162d27" stroke="#162d27">
    <use href="#araucaria" transform="translate(150,745) scale(1.25)"/>
    <use href="#araucaria" transform="translate(275,735) scale(0.9)"/>
    <use href="#araucaria" transform="translate(70,770) scale(0.8)"/>
    <use href="#araucaria" transform="translate(1470,725) scale(1.15)"/>
    <use href="#araucaria" transform="translate(1560,712) scale(0.75)"/>
  </g>

  <!-- Guanacos en la orilla -->
  <g fill="#162d27">
    <use href="#guanaco" transform="translate(1190,604) scale(0.85)"/>
    <use href="#guanaco" transform="translate(1238,602) scale(0.65)"/>
  </g>

  <!-- Caminante con mochila sobre la loma derecha -->
  <g fill="#111" stroke="#111" stroke-linecap="round" stroke-linejoin="round" transform="translate(1290,612)">
    <circle cx="9" cy="-62" r="8" stroke="none"/>
    <rect x="-14" y="-52" width="15" height="25" rx="4" stroke="none"/>
    <line x1="8" y1="-51" x2="4" y2="-25" stroke-width="10"/>
    <line x1="8" y1="-46" x2="21" y2="-31" stroke-width="5"/>
    <line x1="24" y1="-46" x2="29" y2="4" stroke-width="3"/>
    <line x1="4" y1="-25" x2="15" y2="2" stroke-width="7"/>
    <line x1="4" y1="-25" x2="-8" y2="0" stroke-width="7"/>
  </g>

  <!-- Cóndores andinos -->
  <g fill="#161616">
    <use href="#condor" transform="translate(300,300) rotate(-6) scale(1.3)"/>
    <use href="#condor" transform="translate(1250,215) rotate(6) scale(0.95)"/>
    <use href="#condor" transform="translate(1385,300) rotate(-4) scale(0.6)"/>
  </g>
</svg>
